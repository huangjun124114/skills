<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容自动化运营仪表盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #2c3e50; margin-bottom: 8px; }
        .header .update-time { font-size: 14px; color: #7f8c8d; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .stat-value { font-size: 36px; font-weight: 600; color: #3498db; margin-bottom: 8px; }
        .stat-card .stat-label { font-size: 14px; color: #7f8c8d; }
        .stat-card.success .stat-value { color: #27ae60; }
        .stat-card.warning .stat-value { color: #f39c12; }
        .stat-card.danger .stat-value { color: #e74c3c; }
        .section { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section h2 { font-size: 18px; color: #2c3e50; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #ecf0f1; }
        .pipeline-list { overflow-x: auto; }
        .pipeline-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid #ecf0f1; }
        .pipeline-item:last-child { border-bottom: none; }
        .pipeline-id { font-family: monospace; font-size: 13px; color: #7f8c8d; width: 140px; flex-shrink: 0; }
        .pipeline-title { flex: 1; font-size: 15px; color: #2c3e50; }
        .pipeline-stage { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 12px; margin-right: 12px; }
        .stage-active { background: #e3f2fd; color: #1976d2; }
        .stage-completed { background: #e8f5e9; color: #388e3c; }
        .stage-pending { background: #fff3e0; color: #f57c00; }
        .pipeline-time { font-size: 13px; color: #7f8c8d; }
        .activity-list { max-height: 400px; overflow-y: auto; }
        .activity-item { display: flex; padding: 12px 0; border-bottom: 1px solid #ecf0f1; }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { font-size: 13px; color: #7f8c8d; width: 100px; flex-shrink: 0; }
        .activity-content { flex: 1; font-size: 14px; color: #333; }
        .empty-state { text-align: center; padding: 40px; color: #7f8c8d; }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
        .progress-bar { height: 8px; background: #ecf0f1; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); transition: width 0.3s ease; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 内容自动化运营仪表盘</h1>
        <div class="update-time">更新时间：{update_time}</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value">{total_count}</div>
            <div class="stat-label">本周产出</div>
        </div>
        <div class="stat-card success">
            <div class="stat-value">{completed_count}</div>
            <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card warning">
            <div class="stat-value">{active_count}</div>
            <div class="stat-label">进行中</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">{avg_duration}</div>
            <div class="stat-label">平均耗时</div>
        </div>
    </div>

    <div class="section">
        <h2>🔄 活跃流水线</h2>
        <div class="pipeline-list">
            {active_pipelines}
            <!-- 模板：
            <div class="pipeline-item">
                <div class="pipeline-id">{pipeline_id}</div>
                <div class="pipeline-title">{topic_title}</div>
                <span class="pipeline-stage stage-active">{stage}</span>
                <div class="pipeline-time">{elapsed_time}</div>
            </div>
            -->
        </div>
    </div>

    <div class="section">
        <h2>✅ 已完成流水线</h2>
        <div class="pipeline-list">
            {completed_pipelines}
            <!-- 模板：
            <div class="pipeline-item">
                <div class="pipeline-id">{pipeline_id}</div>
                <div class="pipeline-title">{topic_title}</div>
                <span class="pipeline-stage stage-completed">已完成</span>
                <div class="pipeline-time">{duration}</div>
            </div>
            -->
        </div>
    </div>

    <div class="section">
        <h2>📝 最近动态</h2>
        <div class="activity-list">
            {activity_log}
            <!-- 模板：
            <div class="activity-item">
                <div class="activity-time">{time}</div>
                <div class="activity-content">{content}</div>
            </div>
            -->
        </div>
    </div>

    <div class="section">
        <h2>📈 本周统计</h2>
        <div class="stats-grid" style="margin-bottom: 0;">
            <div class="stat-card">
                <div class="stat-value">{total_views}</div>
                <div class="stat-label">总阅读量</div>
            </div>
            <div class="stat-card success">
                <div class="stat-value">{avg_engagement}</div>
                <div class="stat-label">平均互动率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">{total_leads}</div>
                <div class="stat-label">留资线索</div>
            </div>
        </div>
    </div>
</body>
</html>
